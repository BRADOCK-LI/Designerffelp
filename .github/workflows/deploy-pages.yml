name: Deploy Felpdesigner site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Convert portfolio covers to JPEG
        shell: bash
        run: |
          set -e
          file docs/assets/senador-side.webp docs/assets/puracai.webp
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          pairs = [
              ("docs/assets/senador-side.webp", "docs/assets/senador-side.jpg"),
              ("docs/assets/puracai.webp", "docs/assets/puracai.jpg"),
          ]
          for src, dst in pairs:
              with Image.open(src) as im:
                  print(src, im.format, im.size, im.mode)
                  im.convert("RGB").save(dst, "JPEG", quality=92, optimize=True)
          PY
          file docs/assets/senador-side.jpg docs/assets/puracai.jpg
          test -s docs/assets/senador-side.jpg
          test -s docs/assets/puracai.jpg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
